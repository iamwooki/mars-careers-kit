    - {num: "61% · 4만 2천 건", what: "문의가 몰리는 시점과 분석한 로그 수 [P01]", mine: "{사실:내 것} 직접 SQL로 뽑은 값"}
    - {num: 31건, what: "온보딩 문서 [P03]", mine: "{사실:내 것에 가까움} 형식과 취합은 본인, 초안은 주제별 담당자"}
