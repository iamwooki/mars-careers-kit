# 「사용 설명서」의 원천 (예시: 가상 인물 김화성) — 이 파일을 프로젝트 루트의 self-profile.yaml로 복사해 고친다.
# 빌드: python3 .claude/skills/self-profile/scripts/build_profile.py .   → self-profile.html (생성물, 비공개)
# 표기: [P01] 카드 칩 · {사실} {해석} {빈칸} {내부} {주의} 배지 ({사실:내 것}처럼 글자 지정 가능) · **굵게**
# 한 줄짜리 {key: value} 안에 배지({빈칸} 등)나 쉼표·콜론이 든 값은 반드시 큰따옴표로 감싼다.
# 없는 재료의 섹션은 통째로 지워도 된다. 프로젝트 표는 카드에서 자동으로 만들어진다.
meta:
  name: 김화성
  updated: 2026-09-21
headline:
  - 데이터로 불편을 찾는 기획자.
  - 직접 뽑아 보고, 규칙으로 정하고, 다음 사람이 쓰게 남긴다.
summary: >-
  산업공학을 전공하고 커머스 회사의 서비스 운영으로 시작해, 2021년부터 물류 스타트업에서 PM으로 일한다.
  배송 문의 로그 4만 건을 직접 분석해 지연 알림을 개편한 일로 사내 포상을 받았다. 외주 개발을 관리한 경험이 있고,
  누가 시키지 않아도 문서를 남기는 편이다. 개발은 하지 않는다.
tiles:
  - {n: 6년, l: "총 경력 (운영 2년 + PM 4년)"}
  - {n: 1건, l: "포상 (사내 올해의 개선상 2023)"}
timeline:
  lead: 운영에서 시작해 기획으로 옮겼다. 운영 때 본 고객 문의가 지금 기획의 출발점이다.
  start: 2014
  end: 2027
  rows:
    - {label: 학교, items: [[2014.17, 2018.64, 게일크레이터대]]}
    - {label: 일, strong: true, items: [[2019.0, 2021.12, 올림푸스 커머스], [2021.17, 2026.75, 레드샌드 로지스]]}
  marks: [[2022.37, SQLD], [2023.97, 개선상]]
  table:
    - {period: 2019.01 – 2021.02, where: 올림푸스 커머스, what: "고객 문의 분류 체계와 운영 매뉴얼 {빈칸} 카드 없음"}
    - {period: 2021.03 – 현재, where: ㈜레드샌드 로지스, what: "배송 지연 알림 개편 [P01], 협력사 정산 대시보드 [P02], 온보딩 문서 [P03]"}
patterns:
  lead: 카드가 3장뿐이라 패턴이라고 부르기에는 이르다. 지금 보이는 것은 두 가지다.
  items:
    - title: ① 남의 집계를 받기 전에 직접 뽑아 본다
      desc: 문제를 회의에서 듣는 대신 로그를 직접 본다. 숫자마다 누가 뽑았는지 구분해서 말한다.
      evidence:
        - "[P01] 문의 로그 4만 2천 건을 SQL로 뽑아 문의가 몰리는 시점(61%)을 찾았다"
    - title: ② 한 번 정한 것을 문서로 남긴다
      desc: 회의 결정, 요구사항, 온보딩 질문을 다음 사람이 읽을 수 있는 형태로 정리한다.
      evidence:
        - "[P01] 요구사항 정의서 12쪽, QA 시나리오 27건을 직접 작성"
        - "[P03] 입사 첫 달의 질문 46개를 온보딩 문서 31건으로 정리 (자발적 시작)"
can_do:
  lead: 점 5개 = 여러 해 직접 담당하고 성과가 있다, 3개 = 담당했지만 짧거나 일부, 2개 = 개인 수준.
  items:
    - title: 고객 문의·운영 데이터에서 개선 과제를 찾아 출시까지 끌고 가기
      score: 4
      cards: [P01]
      desc: 로그 분석, 규칙 정의, 요구사항 작성, QA, 출시 후 지표 조정까지 한 바퀴를 돌았다.
      role: 서비스 기획자, PM
      caution: 한 건의 사례다. 같은 방식을 다른 서비스에서 되풀이한 기록이 아직 없다.
    - title: 외주 개발이 끼는 사업의 기획과 검수
      score: 2
      cards: [P02]
      desc: 협력사 정산 대시보드를 기획하고 외주 개발의 착수·중간·검수를 관리했다.
      role: 발주 측 담당자
      caution: 분담선과 성과 수치가 비어 있다. 지금은 "관리했다"까지만 말할 수 있다.
skills:
  lead: 각 역량 옆의 카드 번호가 근거다. 근거가 없는 역량은 적지 않았다.
  rows:
    - [기획, 요구사항 정의와 화면 흐름 작성, 4, [P01, P02]]
    - [데이터, SQL로 로그 추출·집계, 3, [P01]]
    - [데이터, 지표 설계와 출시 후 조정, 3, [P01]]
    - [사람·조직, 운영·CS·개발 사이의 조율, 3, [P01]]
    - [글쓰기, 업무 문서화, 4, [P01, P03]]
fit:
  yes:
    - "**운영 데이터가 쌓이는 서비스의 기획.** 문의·로그에서 문제를 찾는 방식이 그대로 통한다."
    - "**문서가 부족한 조직.** 시키지 않아도 정리하는 사람이다."
  no:
    - "**개발 역량을 기대하는 PM 자리.** SQL까지다. 코드를 짠 기록은 없다."
    - "**예산을 쥐는 사업 책임자 자리.** 외주 관리 1건, 그마저 규모가 확인되지 않았다."
