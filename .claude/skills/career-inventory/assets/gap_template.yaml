# STAR-I 갭 분석의 원천 (예시: 가상 인물 김화성) — 이 파일을 inventory/gap.yaml로 복사해 고친다.
# 빌드: python3 .claude/skills/career-inventory/scripts/build_gap_report.py .   → inventory/gap_report.html
# 질문 상태: answer가 있으면 '답함', wait: true면 '자료 대기', 둘 다 없으면 '남음'(메모 칸이 열린다).
# 질문의 순서를 바꾸면 브라우저에 적어 둔 메모의 자리가 어긋난다 (키 = 카드 ID + 순번). 새 질문은 끝에 붙인다.
